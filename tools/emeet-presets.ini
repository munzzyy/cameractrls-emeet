; Example presets for the EMEET C60E 4K Dual, measured in one basement with a ceiling light.
; 1 Stream: the camera picks exposure, sharpness 160 (it only holds 60 fps when the room is bright). 2 is the best 60 fps this room gives without a key light: manual 156, gain 100, brightness 160, still dim and grainy next to 1. 3 adds sharpness 200 and 4K capture for the viewer. 4 is the camera's own defaults with white balance locked.
[preset_names]
1 = Stream
2 = 60fps (light)
3 = Quality
4 = Natural

[preset_1]
brightness = 128
contrast = 128
saturation = 128
hue = 128
white_balance_automatic = 0
gamma = 128
gain = 0
power_line_frequency = 60_hz
white_balance_temperature = 5500
sharpness = 160
backlight_compensation = 1
auto_exposure = aperture_priority_mode
focus_absolute = 384
focus_automatic_continuous = 0
zoom_absolute = 0
emeet_c60e_light = 00ddff

